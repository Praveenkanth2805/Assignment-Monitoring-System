<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMS STAFF Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { margin:0; font-family: Arial,sans-serif; background:#f4f4f4; }
        .sidebar {
            width:250px;
            background: linear-gradient(180deg,#667eea,#764ba2);
            color:white;
            height:100vh;
            position:fixed;
            top:0; left:0;
            display:flex;
            flex-direction:column;
            padding-top:20px;
        }
        .sidebar h2 { text-align:center; margin-bottom:20px; font-size:22px; letter-spacing:1px; }
        .sidebar a { color:white; text-decoration:none; padding:12px 20px; display:block; transition:0.3s; }
        .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,0.2); border-left:4px solid #fff; }
        .main-content { margin-left:250px; padding:20px; }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            min-height: 80px;
        }
        .header h1 { margin: 0; font-size: 20px; text-align: center; flex: 1; }

        /* WELCOME CARD */
        .welcome-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding: 50px;
            margin-top: 50px;
        }
        .welcome-card h2 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .welcome-card p {
            font-size: 18px;
            color: #555;
        }
    </style>
    <script>
function sendStaffReminder() {
    if (confirm('Send WhatsApp reminder for all assignments to not submitted students?')) {
        fetch('/send_staff_reminder', { method: 'POST' })
            .then(res => res.text())
            .then(msg => alert(msg));
    }
}
</script>

</head>
<body>
    <div class="sidebar">
        <h2>AMS STAFF</h2>
        <h2>{{ department_name }}</h2>
        <a href="{{ url_for('staff_dashboard') }}"class="active">🏠 Dashboard</a>
        <a href="{{ url_for('subject_assignment', subject_code=subject_code, semester_number=semester_number, department_id=department_id, start_year=start_year) }}">
📝 Assignment</a>
        <a href="/download_csv/{{ subject_code }}/{{ semester_number }}/{{ department_id }}/{{ start_year }}">⬇️ Download CSV</a>
        <!-- <a href="#" onclick="sendStaffReminder()">⏰ Send Reminder</a> -->
        <a href="/logout">🚪 Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Welcome {{ staff_name }} ({{ start_year }})</h1>
        </div>

        <!-- WELCOME CARD -->
        <div class="welcome-card">
            <h2>Welcome to Staff Dashboard</h2>
            <p>Hello {{ staff_name }}, manage assignments and student data from the sidebar!</p>
        </div>
    </div>
</body>
</html>
