<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ department_name }} - Tutor Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 80px;
            border-radius: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-align: center;
            flex-grow: 1;
        }

        .logout-btn {
            background: #fff;
            color: #764ba2;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #764ba2;
            color: #fff;
        }

        /* Welcome Card */
        .welcome-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding: 50px;
            margin-top: 100px;
        }

        .welcome-card h2 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome-card p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AMS TUTOR</h2>
        <h2>{{ department_name }}</h2>
        <a href="#" class="active">🏠 Dashboard</a>
        <a href="/student_list/{{ department_id }}/{{ start_year }}">🎓 Students</a>
        <a href="/semester/{{ department_id }}/{{ start_year }}">📘 Semester</a>
        <a href="/logout">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>{{ tutor_name }} ({{ start_year }})</h1>
        </div>

        <div class="welcome-card">
            <h2>Welcome to Tutor Dashboard</h2>
            <p>Hello {{ tutor_name }}, manage your students and semesters from the sidebar!</p>
        </div>
    </div>
</body>
</html>
