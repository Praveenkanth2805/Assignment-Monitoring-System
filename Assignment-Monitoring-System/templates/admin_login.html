<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <!--link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"-->
     <style>
        /* Page-specific CSS for Admin Login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: fadeIn 1s;
            width: 300px;
            display: block !important;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button.btn {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        button.btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        window.onload = () => { {% with messages = get_flashed_messages() %}{% if messages %}{{ messages[0] | safe }}{% endif %}{% endwith %} };
    </script>
</head>
<body>
    <div class="form-container" style="display: block !important;">
        <h2>Admin Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <!-- <button class="btn" onclick="location.href='/admin_create_account'">Create Account</button> -->
        <div class="error">{{ get_flashed_messages()[0] if get_flashed_messages() else '' }}</div>
    </div>
</body>
</html>
