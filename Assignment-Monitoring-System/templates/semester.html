<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ department_name }} - Semester</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 80px;
            border-radius: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-align: center;
            flex-grow: 1;
        }

        /* Buttons */
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            text-decoration: none;
            font-size: 16px;
            width: 180px;
        }

        .btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        /* Container */
        .container-box {
            margin-top: 40px;
            background: white;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Semester grid - two per row */
        .sem-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            justify-items: center;
        }

        @media (max-width: 600px) {
            .sem-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AMS TUTOR</h2>
        <h2>{{ department_name }}</h2>
        <a href="/department_page/{{ department_id }}/{{ start_year }}">🏠 Dashboard</a>
        <a href="/student_list/{{ department_id }}/{{ start_year }}">🎓 Students</a>
        <a href="/semester/{{ department_id }}/{{ start_year }}" class="active">📘 Semester</a>
        <a href="/logout">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>{{ department_name }} - Semester ({{ start_year }})</h1>
        </div>

        <div class="container-box">
            <div class="sem-grid">
                {% for sem in semesters %}
                <a href="/subjects/{{ department_id }}/{{ start_year }}/{{ sem[0] }}" class="btn">Semester {{ sem[0] }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
