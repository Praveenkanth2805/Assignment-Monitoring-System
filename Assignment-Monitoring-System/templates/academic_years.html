<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Academic Years</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
        }

        /* Main content next to sidebar */
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 80px;
            border-radius: 10px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            margin: 5px;
            text-decoration: none;
        }

        .btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .menu {
            position: relative;
            display: inline-block;
        }

        .menu-btn,
        .add-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: white;
        }

        .dropdown {
            display: none;
            position: absolute;
            background: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            right: 0;
            z-index: 1;
        }

        .dropdown button {
            display: block;
            padding: 10px;
            width: 100%;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
        }

        .dropdown button:hover {
            background: #667eea;
            color: white;
        }

        .form-container {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            animation: fadeIn 0.5s;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .error {
            color: green;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .year-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            margin: 20px 0;
        }

        /* Academic Year Card */
        .year-item {
            background: white;
            flex: 1 1 calc(33% - 20px);
            min-width: 200px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            box-sizing: border-box;
        }

        .year-btn {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .year-item .menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: black;
        }

        .year-item .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            z-index: 1;
        }

        .year-item .dropdown button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
        }

        .year-item .dropdown button:hover {
            background: #667eea;
            color: white;
        }
    </style>

    <script>
        let openDropdown = null;
        function toggleDropdown(id) {
            if (openDropdown && openDropdown !== id) {
                document.getElementById(openDropdown).style.display = 'none';
            }
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
            openDropdown = el.style.display === 'block' ? id : null;
        }
        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                document.querySelectorAll('.dropdown').forEach(dd => dd.style.display = 'none');
                openDropdown = null;
            }
        }

        function toggleForm(formId) {
            const el = document.getElementById(formId);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function showEditForm(startYear, endYear, tutorName, username) {
            document.getElementById('edit-form').style.display = 'block';
            document.getElementById('edit-start-year').value = startYear;
            document.getElementById('edit-end-year').value = endYear;
            document.getElementById('edit-tutor-name').value = tutorName;
            document.getElementById('edit-username').value = username;
            document.getElementById('edit-password').value = "";
        }

        function showDeleteConfirm(startYear) {
            if (confirm('Delete?')) location.href = '/delete_academic_year/{{ department_id }}/' + startYear;
        }
    </script>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AMS Admin</h2>
        <a href="{{ url_for('admin_dashboard') }}">🏠 Dashboard</a>
        <a href="{{ url_for('departments') }}">🏫 Departments</a>
        <a href="/logout">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>{{ college_name }} - {{ department_name }}</h1>
            <div class="menu">
                <button class="add-btn" onclick="toggleForm('add-form')">+</button>
            </div>
        </div>

        <div class="container">
            <!-- ADD FORM -->
            <div id="add-form" class="form-container">
                <form method="POST" action="/add_academic_year/{{ department_id }}">
                    <input type="number" name="start_year" placeholder="Start Year" required>
                    <input type="number" name="end_year" placeholder="End Year" required>
                    <input type="text" name="tutor_name" placeholder="Tutor Name" required>
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="btn">Add</button>
                    <button type="button" class="btn" onclick="toggleForm('add-form')">Cancel</button>
                </form>
            </div>

            <!-- EDIT FORM -->
            <div id="edit-form" class="form-container">
                <form method="POST" action="">
                    <input type="number" id="edit-start-year" name="start_year" placeholder="Start Year" required>
                    <input type="number" id="edit-end-year" name="end_year" placeholder="End Year" required>
                    <input type="text" id="edit-tutor-name" name="tutor_name" placeholder="Tutor Name" required>
                    <input type="text" id="edit-username" name="username" placeholder="Username" required>
                    <input type="password" id="edit-password" name="password" placeholder="Password" required>
                    <button type="submit" class="btn"
                        onclick="this.form.action='/edit_academic_year/{{ department_id }}/' + document.getElementById('edit-start-year').value">
                        Update
                    </button>
                    <button type="button" class="btn" onclick="toggleForm('edit-form')">Cancel</button>
                </form>
            </div>

            <!-- ACADEMIC YEARS LIST -->
            <div class="year-container">
                {% for year in years %}
                <div class="year-item">
                    <!-- <a href="/department_page/{{ department_id }}/{{ year[0] }}" class="year-btn">
                        {{ year[0] }} - {{ year[1] }}<br>{{ year[2] }}
                    </a> -->
                    <a class="year-btn">
                        {{ year[0] }} - {{ year[1] }}<br>{{ year[2] }}
                    </a>
                    <div class="menu">
                        <button class="menu-btn" onclick="toggleDropdown('dropdown-{{ loop.index }}')">⋮</button>
                        <div class="dropdown" id="dropdown-{{ loop.index }}">
                            <button onclick="showEditForm('{{ year[0] }}', '{{ year[1] }}', '{{ year[2] }}', '{{ year[3] }}')">Edit</button>
                            <button onclick="showDeleteConfirm('{{ year[0] }}')">Delete</button>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="error">{{ get_flashed_messages()[0] if get_flashed_messages() else '' }}</div>
        </div>
    </div>
</body>

</html>
