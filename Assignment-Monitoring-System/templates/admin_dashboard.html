<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ college_name }} - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            min-height: 80px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-align: center;
            flex: 1;
        }

        /* WELCOME CARD */
        .welcome-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding: 50px;
            margin-top: 30px;
        }

        .welcome-card h2 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome-card p {
            font-size: 18px;
            color: #555;
        }

        /* Dashboard Cards */
        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1 1 calc(33% - 20px);
            background: white;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }

        @media(max-width: 992px){
            .card { flex: 1 1 calc(50% - 20px); }
        }

        @media(max-width: 600px){
            .card { flex: 1 1 100%; }
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AMS Admin</h2>
        <a href="{{ url_for('admin_dashboard') }}" class="active">🏠 Dashboard</a>
        <a href="{{ url_for('departments') }}">🏫 Departments</a>
        <a href="/logout">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>{{ college_name }} - Admin Dashboard</h1>
        </div>

        <!-- WELCOME CARD -->
        <div class="welcome-card">
            <h2>Welcome to Admin Dashboard</h2>
            <p>Hello Admin, manage departments and staff data from the sidebar!</p>
        </div>

        <!-- Dashboard Cards -->
        <!-- <div class="cards">
            <div class="card">
                <h3>Total Departments</h3>
                <p>{{ department_count }}</p>
            </div>

            <div class="card">
                <h3>Total Staff</h3>
                <p>{{ staff_count }}</p>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <p>{{ student_count }}</p>
            </div>
        </div> -->
    </div>
</body>
</html>
