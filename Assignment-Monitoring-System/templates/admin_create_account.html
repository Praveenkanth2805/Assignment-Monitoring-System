<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Admin Account</title>
    <!--link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"-->
    <style>
        /* Page-specific CSS for Create Admin Account */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s;
            width: 300px;
            display: block !important;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .btn {
            width: 48%;
            padding: 10px;
            margin: 10px 1%;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        .btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        window.onload = () => { {% with messages = get_flashed_messages() %} {% if messages %} { { messages[0] | safe } } {% endif %} {% endwith %} };
    </script>
</head>

<body>
    <div class="form-container" style="display: block !important;">
        <h2>Create Admin Account</h2>
        <form method="POST">
            <input type="text" name="college_code" placeholder="College Code" required>
            <input type="text" name="college_name" placeholder="College Name" required>
            <input type="text" name="university" placeholder="University" required>
            <input type="text" name="admin_name" placeholder="Admin Name" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <div class="btn-container">
                <button type="submit" class="btn">Create</button>
                <button type="button" class="btn" onclick="location.href='/admin_login'">Cancel</button>
            </div>
        </form>
        <div class="error">{{ get_flashed_messages()[0] if get_flashed_messages() else '' }}</div>
    </div>
</body>

</html>
